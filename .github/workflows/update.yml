name: Feed'leri guncelle

on:
  schedule:
    - cron: "0 */6 * * *"   # 6 saatte bir
  workflow_dispatch:          # elle tetikleme
  push:
    branches: [ main ]
    paths:
      - "config/feeds.json"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bagimliliklar
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Feed'leri cek ve siniflandir
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch.mjs

      - name: data.json'u commit et
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "chore: feed verisini guncelle"
            git push
          fi
